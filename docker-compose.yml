services:
  postgres:
    image: postgres:16
    container_name: portalindex-db
    environment:
      POSTGRES_USER: portalindex
      POSTGRES_PASSWORD: portalindex
      POSTGRES_DB: portalindex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
